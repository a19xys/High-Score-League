name: Windows release - publish validated draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable launcher version of the existing draft
        required: true
        type: string
      confirmation:
        description: Type exactly PUBLICAR v<version>
        required: true
        type: string

permissions: {}

concurrency:
  group: hsl-windows-stable-release
  cancel-in-progress: false

jobs:
  publish:
    name: Revalidate original bytes and publish stable/latest
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    environment: windows-release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout exact workflow commit without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node 22 without installing packages
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Locate exact draft, provenance, Stage run and artifact
        id: locate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HSL_RELEASE_VERSION: ${{ inputs.version }}
          HSL_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        working-directory: local/hsl-local-app
        run: node scripts/windows-release-github.js locate --version "$HSL_RELEASE_VERSION" --confirmation "$HSL_RELEASE_CONFIRMATION"

      - name: Download exact artifact by Stage run ID and artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: a19xys/High-Score-League
          run-id: ${{ steps.locate.outputs.stage-run-id }}
          artifact-ids: ${{ steps.locate.outputs.artifact-id }}
          path: local/hsl-local-app/release-bundle

      - name: Validate original bundle with Node built-ins only
        env:
          HSL_RELEASE_VERSION: ${{ inputs.version }}
          HSL_SOURCE_COMMIT: ${{ steps.locate.outputs.source-commit }}
          HSL_SOURCE_REF: ${{ steps.locate.outputs.source-ref }}
        working-directory: local/hsl-local-app
        run: node scripts/validate-windows-release-bundle.js --version "$HSL_RELEASE_VERSION" --source-commit "$HSL_SOURCE_COMMIT" --source-ref "$HSL_SOURCE_REF"

      - name: Revalidate remote state and publish stable/latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HSL_RELEASE_VERSION: ${{ inputs.version }}
          HSL_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        working-directory: local/hsl-local-app
        run: node scripts/windows-release-github.js publish --version "$HSL_RELEASE_VERSION" --confirmation "$HSL_RELEASE_CONFIRMATION"
