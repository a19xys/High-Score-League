name: Windows release - build and stage

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable launcher version (must equal local/hsl-local-app/package.json)
        required: true
        type: string
      mode:
        description: Build only, or also create/verify a draft Release
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - stage
      notes:
        description: Optional launcher-only release notes
        required: false
        type: string

permissions: {}

concurrency:
  group: hsl-windows-stable-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate exact Windows bytes
    runs-on: windows-2025
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: ${{ steps.names.outputs.artifact-name }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    defaults:
      run:
        shell: pwsh
        working-directory: local/hsl-local-app
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Verify repository, master HEAD, version and remote release state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HSL_RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/windows-release-github.js preflight --version "$env:HSL_RELEASE_VERSION"

      - name: Install locked dependencies
        run: npm ci

      - name: Run all tests
        run: npm test

      - name: Build NSIS once with publishing disabled
        run: npm run dist:win

      - name: Smoke-test the packaged app
        run: npm run smoke:packaged

      - name: Prepare canonical release bundle from validated dist
        env:
          HSL_RELEASE_VERSION: ${{ inputs.version }}
          HSL_SOURCE_COMMIT: ${{ github.sha }}
          HSL_SOURCE_REF: ${{ github.ref }}
        run: npm run prepare:release-bundle -- --version "$env:HSL_RELEASE_VERSION" --source-commit "$env:HSL_SOURCE_COMMIT" --source-ref "$env:HSL_SOURCE_REF"

      - name: Revalidate canonical release bundle
        env:
          HSL_RELEASE_VERSION: ${{ inputs.version }}
          HSL_SOURCE_COMMIT: ${{ github.sha }}
          HSL_SOURCE_REF: ${{ github.ref }}
        run: npm run validate:release-bundle -- --version "$env:HSL_RELEASE_VERSION" --source-commit "$env:HSL_SOURCE_COMMIT" --source-ref "$env:HSL_SOURCE_REF"

      - name: Define immutable artifact name
        id: names
        env:
          HSL_RELEASE_VERSION: ${{ inputs.version }}
          HSL_RUN_ID: ${{ github.run_id }}
        run: "Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('artifact-name=hsl-windows-release-' + $env:HSL_RELEASE_VERSION + '-' + $env:HSL_RUN_ID)"

      - name: Preserve exact bundle for human QA and Publish
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.names.outputs.artifact-name }}
          path: local/hsl-local-app/release-bundle/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: false

      - name: Exercise code-enforced dry-run after the build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HSL_RELEASE_VERSION: ${{ inputs.version }}
          HSL_RELEASE_MODE: dry-run
          HSL_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          HSL_ARTIFACT_NAME: ${{ steps.names.outputs.artifact-name }}
          HSL_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: node scripts/windows-release-github.js stage --mode dry-run --version "$env:HSL_RELEASE_VERSION"

      - name: Record build provenance summary
        env:
          HSL_RELEASE_VERSION: ${{ inputs.version }}
          HSL_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          HSL_ARTIFACT_NAME: ${{ steps.names.outputs.artifact-name }}
          HSL_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          HSL_RUN_ID: ${{ github.run_id }}
          HSL_COMMIT: ${{ github.sha }}
          HSL_MODE: ${{ inputs.mode }}
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @"
          ## Windows release build
          - Version: ``$env:HSL_RELEASE_VERSION``
          - Mode: ``$env:HSL_MODE``
          - Commit: ``$env:HSL_COMMIT``
          - Run: ``$env:HSL_RUN_ID``
          - Artifact: ``$env:HSL_ARTIFACT_NAME`` (ID ``$env:HSL_ARTIFACT_ID``)
          - Artifact digest: ``$env:HSL_ARTIFACT_DIGEST``
          - Release mutations in this job: none
          "@

  stage:
    name: Create or reconcile draft only
    if: ${{ inputs.mode == 'stage' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout exact workflow commit without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node 22 without installing packages
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Download exact artifact produced by the build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: local/hsl-local-app/release-bundle

      - name: Validate downloaded bundle with Node built-ins only
        env:
          HSL_RELEASE_VERSION: ${{ inputs.version }}
          HSL_SOURCE_COMMIT: ${{ github.sha }}
          HSL_SOURCE_REF: ${{ github.ref }}
        working-directory: local/hsl-local-app
        run: node scripts/validate-windows-release-bundle.js --version "$HSL_RELEASE_VERSION" --source-commit "$HSL_SOURCE_COMMIT" --source-ref "$HSL_SOURCE_REF"

      - name: Create or reconcile draft and verify every remote byte
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HSL_RELEASE_VERSION: ${{ inputs.version }}
          HSL_RELEASE_MODE: stage
          HSL_RELEASE_NOTES: ${{ inputs.notes }}
          HSL_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          HSL_ARTIFACT_NAME: ${{ needs.build.outputs.artifact-name }}
          HSL_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
        working-directory: local/hsl-local-app
        run: node scripts/windows-release-github.js stage --mode stage --version "$HSL_RELEASE_VERSION"
